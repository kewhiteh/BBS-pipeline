[source]
release = "10.5066/P144YU3S"
raw_dir = "data/raw"
cache_dir = "data/sanitized_cache"
offline = false
rebuild_cache = false
http_timeout_seconds = 30.0
http_retries = 3
http_backoff_seconds = 1.0

[routes]
states = []
bcrs = [27, 28, 29]
strata = []
route_ids = []
boundary = ""

[runs]
start_year = 1995
end_year = 2025
run_types = [1]
quality_current_ids = [1]
min_continuity = 0.8
drop_observer_first_year = false

[observations]
source = "10_stop"
stops = "route_total"
zero_fill = true
lump_subspecies = true
rolling_years = 0

[species]
aous = []
common_names = []
families = []
orders = []

[guilds]
file = ""
filters = {}
unmatched = "report"

[joins]
routes = ["StateNum", "Route", "RouteName", "Latitude", "Longitude", "Stratum", "BCR"]
weather = ["ObsN", "RunType", "QualityCurrentID"]
observer = []
vehicle = []
species = ["English_Common_Name", "Order", "Family", "Genus", "Species"]
guilds = ["*"]

[output]
path = "output/5812_final_project_data.gpkg"
crs = "EPSG:4269"
layer_name = "bbs_observations"
overlays = {}
manifest = true
shape = "long"
wide_value = "route_total"
