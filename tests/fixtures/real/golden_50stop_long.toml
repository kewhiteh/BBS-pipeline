# Golden test: 50-stop data, long output. Paths are set by tests/test_golden.py.
[routes]
route_ids = ["63_101", "63_207", "63_224", "63_311", "63_031", "63_228",
             "63_906", "63_910", "63_012", "63_024", "63_027", "63_225"]

[runs]
start_year = 2015
end_year = 2024
run_types = [1]
quality_current_ids = [1]
min_continuity = 0.8

[observations]
source = "50_stop"
stops = "ten_stop_bins"
rolling_years = 3

[guilds]
file = "guilds/pwrc_species_groups.csv"

[joins]
routes = ["RouteName", "BCR"]
weather = ["Month", "Day", "ObsN"]
observer = ["is_first_year", "tenure_tier"]
vehicle = ["CarTotal"]
species = ["English_Common_Name", "Family"]
guilds = ["breeding_habitat"]

[output]
path = "golden_50stop_long.csv"
manifest = false
