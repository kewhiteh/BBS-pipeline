[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bbs-pipeline"
version = "3.0.0"
description = "Clean-room v3 North American Breeding Bird Survey (BBS) Spatial & Ecological ETL Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "geopandas>=1.0.0",
    "pyogrio>=0.9.0",
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
bbs = "bbs_pipeline.cli:main"
bbs-pipeline = "bbs_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bbs_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
